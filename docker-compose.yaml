# PostgreSQL 컨테이너 (EC2 에서 사용)
# 실행: docker compose up -d
# 접속 정보는 프로젝트 루트의 .env 에서 읽어옴 (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB)
services:
  db:
    image: postgres:17
    container_name: board-postgres
    restart: unless-stopped
    # ${...} 값은 docker compose 가 같은 폴더의 .env 에서 자동으로 읽음
    # (env_file 로 .env 전체를 넣으면 JWT 비밀키 등 앱 설정까지 DB 컨테이너에 들어가므로 사용하지 않음)
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-board}
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1 에만 열어서 EC2 외부(인터넷)에서는 DB에 직접 접속할 수 없게 함
      # 같은 EC2 의 FastAPI 는 localhost:5432 로 접속
      - "127.0.0.1:5432:5432"
    volumes:
      # 컨테이너를 지웠다 다시 만들어도 데이터 유지
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
